name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking-change'
  minor:
    labels:
      - 'minor'
      - 'enhancement'
      - 'feature'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bug'
  default: patch

categories:
  - title: '🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
  - title: '⚡ Performance Improvements'
    labels:
      - 'perf'
      - 'performance'
  - title: '🔄 Refactoring & Code Quality'
    labels:
      - 'refactor'
  - title: '📝 Documentation'
    labels:
      - 'docs'
      - 'documentation'
  - title: '🔧 Maintenance & CI/CD'
    labels:
      - 'chore'
      - 'ci'
      - 'dependencies'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/raktimneog08-ops/rust-mini-projects/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
